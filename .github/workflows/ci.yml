name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck:lib
      - run: npm run build:lib
      - run: npm run build:doc
      - name: Check generated AI files are up to date
        run: |
          node skills/xeerpe/scripts/generate-references.mjs
          npx prettier --write .claude-plugin/plugin.json
          git diff --exit-code -- skills .claude-plugin lib/AGENTS.md doc/public/llms-full.txt
