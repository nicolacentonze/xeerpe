name: Release

# On every push to main:
#   1. if there are pending changesets, bump the version + CHANGELOG and commit it to main
#   2. publish any version of xeerpe that is not on npm yet, then tag it and create the GitHub release
# Pushes made with GITHUB_TOKEN do not trigger workflows, so the version commit does not loop.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version commit, tags, GitHub releases
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Always the latest main, so a re-run after a failure picks up the version commit
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci

      - name: Check quality
        run: |
          npm run format:check
          npm run typecheck:lib

      - name: Version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "No pending changesets"
            exit 0
          fi
          npm run version-packages
          # Regenerate the AI-agent files so they carry the new version (AGENTS.md ships in the npm package)
          npm run skill:generate
          npx prettier --write lib/CHANGELOG.md lib/package.json
          VERSION=$(node -p "require('./lib/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): xeerpe@$VERSION"
          git push origin HEAD:main

      - name: Publish
        id: publish
        run: |
          VERSION=$(node -p "require('./lib/package.json').version")
          if [ -n "$(npm view "xeerpe@$VERSION" version 2>/dev/null)" ]; then
            echo "xeerpe@$VERSION is already on npm, nothing to publish"
            exit 0
          fi
          npm run release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag and GitHub release
        if: steps.publish.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          TAG="xeerpe@$VERSION"
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG"
          # Release notes = the CHANGELOG section of this version
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' lib/CHANGELOG.md > notes.md
          # The skill, zipped for tools that install it from a file (e.g. Claude upload), attached to the release
          (cd skills && zip -rq "../xeerpe-skill-$VERSION.zip" xeerpe -x "xeerpe/scripts/*")
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "xeerpe-skill-$VERSION.zip"
